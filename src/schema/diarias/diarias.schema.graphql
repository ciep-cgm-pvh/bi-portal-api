scalar DateTime

input DateRangeInput {
  from: DateTime
  to: DateTime
}

# Define o tipo para os filtros que podemos receber
input DiariasFilters {
  dateRange: DateRangeInput
  departmentCode: String
  status: String
  processNumber: String
  employee: String
}

input DiariasFiltersOptions {
  dateRange: DateRangeInput
  departmentCode: String
  status: String
  processNumber: String
  employee: String
}

input DiariasTableFilters {
  grantedDate: String
  grantedAmount: String
  departmentCode: String
  processNumber: String
  employee: String
  status: String
}

# Dados para os KPIs
type KpiData {
  totalAprovado: Float
  totalConcedido: Float
  totalDiarias: Int
}

# Dados para o gráfico de Top Orgaos
type GastoOrgaoDiaria {
  name: String
  total: Float
}

type GastoFuncionarioDiaria {
  name: String
  total: Float
}

# Dados para o gráfico de Gasto Mensal
type GastoMesDiaria {
  name: String
  total: Float
}

type DiariasCharts {
  GastoOrgaoDiaria: [GastoOrgaoDiaria]
  GastoFuncionarioDiaria: [GastoFuncionarioDiaria]
  GastoMesDiaria: [GastoMesDiaria]
}

type Diarias {
  tipoDespesa: String
  ndaPagamento: String
  dtPagamento: String
  ndaLiquidacao: String
  nomDocFiscal: String
  ndaEmpenho: String
  funcionario: String
  docFuncionario: String
  dataLimiteEntrega: String
  dataLimiteGasto: String
  dtConcedidosAprovar: String
  historico: String
  vlrConcedidosAprovar: Float
  dtAprovar: String
  vlrAprovar: Float
  dtImpugnado: String
  vlrImpugnado: Float
  dtInadimplencia: String
  vlrInadimplencia: Float
  dtAprovado: String
  vlrAprovado: Float
  dtCancelado: String
  vlrCancelado: Float
  vlrConcedido: Float
  saldo: Float
  nomEntidade: String
  cnoOrgao: String
  cnoUnidadeOrcamentaria: String
  cnoFuncao: String
  cnoSubfuncao: String
  cnoPrograma: String
  cnoAcao: String
  cnoPlanoDespesa: String
  cnoSubelemento: String
  cnoFonteRecurso: String
  dataBaseContagem: String
  dataFinalPrestarConta: String
  diasAtraso: String
  nroProcesso: String
  nmrAdiantamento: String
  id: String
}

# O tipo Diaria para a tabela
type DiariaTable {
  departmentCode: String
  processNumber: String
  employee: String
  grantedAmount: Float
  grantedDate: String
  status: String
}

type DiariasTableResponse {
  data: [DiariaTable]
  totalCount: Int!
}

type FilterOption {
  value: String
  label: String
}

type FilterOptionsDiaria {
  departmentCode: [FilterOption]
  status: [FilterOption]
  processNumber: [FilterOption]
  employee: [FilterOption]
}

# A Query principal
type Query {
  getDiarias(filters: DiariasFilters): [Diarias]
  getDiariasTable(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: DiariasFilters
    tableFilters: DiariasTableFilters
  ): DiariasTableResponse

  getDiariasLastUpdate: DateTime
  getDiariasKpi(filters: DiariasFilters): KpiData
  getDiariasCharts(filters: DiariasFilters): DiariasCharts
  getDiariasFiltersOptions(filters: DiariasFiltersOptions): FilterOptionsDiaria
}
