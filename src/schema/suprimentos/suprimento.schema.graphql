# src/schema/suprimentos/suprimento.schema.graphql

# === Inputs ===

input SuprimentoFiltersInput {
  dateRange: DateRangeInput
  departmentCode: String
  status: String
  processNumber: String
  employee: String
}

input SuprimentoTableFiltersInput {
  approvalDate: String
  grantedAmount: String
  departmentCode: String
  processNumber: String
  commitmentNumber: String
  employee: String
  status: String
}

# === Tipos de Dados ===

type Suprimento {
  id: String
  expenseType: String
  paymentNumber: String
  paymentDate: String
  settlementNumber: String
  fiscalDoc: String
  commitmentNumber: String
  employee: String
  employeeDoc: String
  limitDeliveryDate: String
  limitSpendDate: String
  requestDate: String
  history: String
  amountRequested: Float
  approvalDate: String
  amountApproved: Float
  disallowedDate: String
  disallowedValue: Float
  defaultDate: String
  defaultValue: Float
  grantedDate: String
  grantedValue: Float
  canceledDate: String
  canceledValue: Float
  grantedAmount: Float
  balance: Float
  entityName: String
  departmentCode: String
  budgetUnitCode: String
  functionCode: String
  subFunctionCode: String
  programCode: String
  actionCode: String
  expensePlanCode: String
  subElementCode: String
  resourceSourceCode: String
  baseDate: String
  finalAccountDate: String
  delayDays: String
  processNumber: String
  advanceNumber: String
  status: String
}

# Tipo para a tabela (campos reduzidos)
type SuprimentoTable {
  departmentCode: String
  commitmentNumber: String
  processNumber: String
  employee: String
  grantedAmount: Float
  approvalDate: String
  status: String
}

type PaginatedSuprimento {
  data: [SuprimentoTable]
  totalCount: Int
}

# === KPIs ===

type SuprimentoKpis {
  totalConcedido: Float
  totalAprovado: Float
  totalProcessos: Int
  lastUpdate: String
}

# === Charts ===

type SuprimentoChartData {
  name: String
  total: Float
}

type SuprimentoCharts {
  GastoOrgao: [SuprimentoChartData]
  GastoMes: [SuprimentoChartData]
  GastoFuncionario: [SuprimentoChartData]
}

# === FilterOptions ===

type SuprimentoFilterOption {
  value: String
  label: String
}

type SuprimentoFilterOptions {
  employee: [SuprimentoFilterOption]
  processNumber: [SuprimentoFilterOption]
  status: [SuprimentoFilterOption]
  departmentCode: [SuprimentoFilterOption]
}

# === Queries ===

extend type Query {
  getSuprimentos(filters: SuprimentoFiltersInput): [Suprimento]

  getSuprimentoTable(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: SuprimentoFiltersInput
    tableFilters: SuprimentoTableFiltersInput
  ): PaginatedSuprimento

  getSuprimentoLastUpdate: DateTime

  SuprimentoKpis(filters: SuprimentoFiltersInput): SuprimentoKpis

  SuprimentoCharts(filters: SuprimentoFiltersInput): SuprimentoCharts

  SuprimentoFilterOptions(filters: SuprimentoFiltersInput): SuprimentoFilterOptions
}
