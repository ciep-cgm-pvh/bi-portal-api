scalar DateTime

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

input AbastecimentoFiltersInput {
  dateRange: DateRangeInput
  fuelType: String
  vehiclePlate: String
  vehicleBrand: String
  driverName: String
  department: String 
  vehicleModel: String
  gasStationCity: String
  gasStationName: String
  excludePostoInterno: String
}

input AbastecimentoFiltersOptionsInput {
  dateRange: DateRangeInput
  fuelType: String
  vehiclePlate: String
  department: String
  vehicleModel: String
  gasStationCity: String
  gasStationName: String
  excludePostoInterno: Boolean
}

input AbastecimentoTableFiltersInput {
  datetime: String
  cost: String
  fuelVolume: String
  fuelType: [String]
  driverName: String
  vehiclePlate: String
  vehicleModel: String
  vehicleBrand: String
  gasStationName: [String]
  gasStationCity: [String]
  department: [String] # ou String, se quiser só um valor
}

type Vehicle {
  plate: String
  model: String
  brand: String
  kmRodado: Float
}

type GasStation {
  name: String
  city: String
}

type Abastecimento {
  id: ID!
  datetime: DateTime
  cost: Float
  fuelVolume: Float
  fuelType: String
  driverName: String
  vehicle: Vehicle
  gasStation: GasStation
  department: String
  km: Float
}

type AbastecimentoColumn {
  header: String!
  accessor: String!
  sortable: Boolean!
  dataType: String!
  isFilterable: Boolean!
  filterKey: String
}

type AbastecimentoKpis {
  totalCost: Float!
  fuelConsumed: Float!
  kilometersDriven: Float!
  vehiclesCount: Int!
  dailyAverageCost: Float!
  suppliesCount: Int!
  lastUpdate: DateTime!
}

type vehicleSummary {
  vehicle: Vehicle
  department: String
  totalCost: Float
}

type FilterType {
  value: String
  label: String
}

type FilterOption {
  departmentOptions: [FilterType!]
  vehiclePlateOptions: [FilterType!]
  vehicleModelOptions: [FilterType!]
  gasStationCityOptions: [FilterType!]
  gasStationNameOptions: [FilterType!]
}

type CostByVehicle {
  vehicle: String!
  total: Float!
}

type CostByDepartment {
  department: String!
  total: Float!
}

type CostByCity {
  city: String!
  total: Float!
}

type CostByGasStation {
  name: String!
  total: Float!
}

type CostByPlate {
  plate: String!
  total: Float!
}

type CostByDate {
  date: String! # yyyy-mm-dd
  total: Float!
}

type CostOverTime {
  date: String! # yyyy-mm-dd
  total: Float!
}

type RankingByDate {
  date: String! # yyyy-mm-dd
  total: Float!
}

type RankingByPlate {
  plate: String!
  total: Float!
  quantity: Int!
}

type RankingByDepartment {
  department: String!
  total: Float!
}

type AbastecimentoCharts {
  costByVehicle: [CostByVehicle!]
  costByDepartment: [CostByDepartment!]
  costByCity: [CostByCity!]
  costByGasStation: [CostByGasStation!]
  costByPlate: [CostByPlate!]
  costByDate: [CostByDate!]
  costOverTime: [CostOverTime!]

  rankingByDate: [RankingByDate!]
  rankingByPlate: [RankingByPlate!]
  rankingByDepartment: [RankingByDepartment!]
}

scalar JSON

type Query {
  abastecimentoRawData: JSON
  getAbastecimentos(filters: AbastecimentoFiltersInput): [Abastecimento!]!
  getAbastecimentosTable(
    limit: Int
    offset: Int
    sortBy: String
    sortDirection: String
    filters: AbastecimentoFiltersInput 
    tableFilters: AbastecimentoTableFiltersInput
  ): [Abastecimento!]!

  getAbastecimentosTableCount(
    filters: AbastecimentoFiltersInput
    tableFilters: AbastecimentoTableFiltersInput
    ): Int!
  getAbastecimentoKpi(filters: AbastecimentoFiltersInput): AbastecimentoKpis!
  getAbastecimentoVehicleSummary: [vehicleSummary]

  AbastecimentoFilterOptions(filters: AbastecimentoFiltersOptionsInput): FilterOption!

  getAbastecimentoCharts(vehicleLimit: Int, filters: AbastecimentoFiltersInput): AbastecimentoCharts!

  getAbastecimentosColumns: [AbastecimentoColumn!]!
}
